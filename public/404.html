<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page introuvable — QFJB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Space+Grotesk:wght@700&display=swap"
    />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 1.5rem;
        font-family:
          "Source Sans 3",
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: #f8fafc;
        color: #0f2c59;
      }
      .card {
        max-width: 30rem;
        width: 100%;
        text-align: center;
        border: 4px solid #0f2c59;
        border-radius: 1rem;
        background: #fff;
        padding: 2.5rem 2rem;
        box-shadow: 8px 8px 0 #0f2c59;
      }
      .code {
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-size: 4.5rem;
        font-weight: 700;
        line-height: 1;
        color: #e63946;
        margin: 0;
      }
      h1 {
        font-family: "Montserrat", system-ui, sans-serif;
        font-size: 1.4rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.01em;
        margin: 0.75rem 0 0.5rem;
      }
      p {
        margin: 0 0 1.75rem;
        font-size: 1rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        background: #e63946;
        color: #fff;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.01em;
        text-decoration: none;
        padding: 0.85rem 1.5rem;
        border: 3px solid #0f2c59;
        border-radius: 0.6rem;
        box-shadow: 4px 4px 0 #0f2c59;
      }
      a:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 #0f2c59;
      }
      .suits {
        font-size: 1.75rem;
        letter-spacing: 0.4rem;
        color: #e63946;
      }
    </style>
  </head>
  <body>
    <div class="suits" aria-hidden="true">&spades; &hearts; &diams; &clubs;</div>
    <div class="card">
      <p class="code">404</p>
      <h1>Cette page a filé comme un singleton</h1>
      <p>
        Le lien est cassé ou la page a été déplacée. Pas de panique, la table est toujours
        dressée&nbsp;: rendez-vous tous les jeudis à 20h.
      </p>
      <a href="/">Retour à l'accueil</a>
    </div>
  </body>
</html>
